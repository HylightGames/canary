[package]
name = "canary-loc"
description = "Canary Engine localization: LocKey + Fluent (.ftl) resolution. See docs/architecture/localization.md and ADR 0015."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2.0.19"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

# Load-bearing dependency for this crate (see ADR 0015 for why this, not
# fluent-templates/fluent-fallback/i18n-embed). `fluent` re-exports
# fluent-bundle's types (FluentBundle, FluentResource, FluentArgs,
# FluentValue), so fluent-bundle isn't listed separately here -- adding
# it as its own direct dependency would just resolve a second, redundant
# copy without giving access to anything `fluent` doesn't already expose.
# Stays on the 0.16 line (tried 0.17, 2026-09): fluent-langneg 0.14 moved
# its locale identifier from unic-langid to icu_locid, so taking 0.17
# would migrate this crate's public locale type -- an ADR-level API
# decision, not a version bump. Revisit with that ADR, not before.
fluent = "0.16"

# `fluent` does *not* re-export this one -- needed directly for
# `ParserError`, surfaced in this crate's own `LoaderError` when a
# `.ftl` file fails to parse.
fluent-syntax = "0.11"

# Locale-fallback-chain resolution -- already a transitive dependency of
# `fluent`, listed explicitly here since this crate calls it directly
# (see ADR 0015 for why this, not fluent-fallback's Localization type).
fluent-langneg = "0.13"

# Locale identifiers (the `LanguageIdentifier` type fluent-langneg's API
# is built around), with the `langid!()` const macro for compile-time-
# known locale constants (used for this crate's configured default
# locale). Listed explicitly (not left purely transitive) because this
# crate uses its macro directly, not just its types.
unic-langid = { version = "0.9", features = ["macros"] }

# Explicit transitive deps (not floor pins): these move with their normal
# caret requirements now that the sandbox floor is retired (see
# docs/development/build-system.md history section).
rustc-hash = "2"
unic-langid-impl = "0.9"
unic-langid-macros = "0.9"
unic-langid-macros-impl = "0.9"

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tempfile = "3"
