[package]
name = "canary-plugin-api"
description = "Canary Engine plugin trait surface and native (Tier B) plugin loader."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2.0.19"
canary-ecs = { path = "../canary-ecs" }

# Host-only: the native (Tier B) and WASM (Tier A) plugin *loaders*
# (loader.rs / tier_a.rs, cfg-gated the same way in lib.rs) run on the
# engine side and depend on libloading/wasmtime, neither of which
# belongs in a wasm32-wasip2 build -- wasmtime in particular is the
# *host* runtime that loads and executes a wasm component, which has no
# meaning running as one. This is also why `cargo check -p
# canary-plugin-api --target wasm32-wasip2` (CI's "WASM component
# target compiles" job) was failing: it checked the whole crate,
# including these, so wasmtime-wasi's own transitive `io-lifetimes`
# dependency was being asked to compile for wasm32-wasip2 too, which
# fails on `error[E0658]: use of unstable library feature "wasip2"`
# regardless of this crate's own code -- io-lifetimes 2.0.4 references
# unstable `std::os::wasi` items internally. Gating these out entirely
# rather than chasing that error directly, since letting them build for
# wasm32-wasip2 was never correct to begin with.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
libloading = "0.9"

# Tier A (WASM Component Model / WASI 0.2) loader, v0.0.3. Tracks the
# current wasmtime major as a caret requirement (48.x as of 2026-09,
# MSRV 1.95 — within this workspace's rustc 1.98.1; re-check MSRV on
# each major bump). History: originally pinned to 21.0.2 for the old
# rustc-1.75 sandbox floor, then to 36.0.15 as the earliest patch
# closing RUSTSEC-2026-0095/-0096/-0269 (see
# docs/development/build-system.md history section). Both wasmtime
# entries here (main + dev `wat`-feature) must move together — same
# crate, one lockfile resolution.
wasmtime = { version = "48", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
# NOTE: `wasmtime-wasi` is deliberately *not* a dependency: nothing in
# `src/` references `wasmtime_wasi::`, and adding it pulls a second full
# wasmtime build graph for no coverage. When a real `wasmtime_wasi::`
# call site lands, pin it to the exact same version as `wasmtime` above
# (upstream releases both in lockstep): a past automated bump moved only
# one of the pair and Cargo silently resolved a second, separate wasmtime
# to satisfy the other. See .github/dependabot.yml's ignore list.

[dev-dependencies]
# The `wat` feature (WAT text-format parsing) is dev-only on purpose:
# production Tier A loading always goes through real `.wasm` binaries
# (see docs/roadmap/v0.0.3-roadmap.md's `.cwasm`-is-a-cache-artifact,
# `.wasm`-is-canonical note), so nothing in `src/` needs it. This
# crate's tests use inline WAT fixtures instead of an external
# `cargo-component`/`wit-bindgen` toolchain -- see `tier_a.rs`'s test
# module docs. Cargo unifies this feature in for `cargo test` builds
# without it affecting `cargo build --release`.
wasmtime = { version = "48", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
# Used directly in tier_a.rs's tests (wat::parse_str), not just pulled
# in transitively via wasmtime's own "wat" feature above -- needs an
# explicit dependency entry. Left unpinned (unlike the old =1.207.0)
# since nothing here requires rustc 1.75 anymore; cargo resolves
# whatever's compatible with wasmtime 48.x's own wat requirement.
wat = "1"
