[package]
name = "canary-plugin-api"
description = "Canary Engine plugin trait surface and native (Tier B) plugin loader."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2.0.19"
canary-ecs = { path = "../canary-ecs" }
# Pinned below latest for this sandbox's validation build: libloading's own
# latest release (0.9.0) has raised its MSRV to rustc 1.88, newer than the
# apt-installed rustc 1.75 available here (see
# docs/development/build-system.md and the analogous note in
# engine/canary-ecs/Cargo.toml). 0.8.6 is the newest release still
# compatible with 1.75. Bump once building against a current `stable`
# toolchain.
libloading = "=0.8.6"

# Tier A (WASM Component Model / WASI 0.2) loader, v0.0.3. Pinned to
# 36.0.15 -- not "latest" (48.x) and not the original 21.0.2 -- for two
# independent reasons that both point at the same version:
#   1. Security: 21.0.2 accumulated 18 real RustSec advisories over its
#      lifetime, including two CRITICAL (9.0) wasmtime sandbox-escape
#      bugs (RUSTSEC-2026-0095, RUSTSEC-2026-0096) and one HIGH (8.8)
#      filesystem sandbox escape (RUSTSEC-2026-0269) -- serious for a
#      crate whose entire job is sandboxing untrusted plugin code.
#      36.0.15 is the earliest 36.x patch that closes all of them
#      (cargo-audit-confirmed); earlier 36.x patches don't cover
#      RUSTSEC-2026-0269 (needs >=36.0.14).
#   2. Toolchain reach: 36.x needs rustc >=1.86 -- within reach of the
#      rustc-1.91 apt package (see
#      docs/development/build-system.md#the-rustc-175-sandbox-validation-floor,
#      updated below), but 46.x/47.x/48.x need >=1.94, which isn't
#      apt-installable here yet. Move up when it is.
wasmtime = { version = "=36.0.15", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
# wasmtime-wasi must be pinned to the exact same version as wasmtime
# above -- the upstream project releases both in lockstep specifically
# so their types stay compatible with each other. Learned the hard way,
# not just asserted: an automated dependency bump once moved this to
# 24.0.10 alone, leaving wasmtime at 21.0.2, which Cargo resolved by
# pulling in a *second*, separate wasmtime 24.x purely to satisfy
# wasmtime-wasi's own transitive requirement -- harmless only because
# this crate doesn't currently use wasmtime-wasi's API surface at all
# (confirmed: no `wasmtime_wasi::` reference anywhere in src/), so no
# type-mismatch compile error ever actually surfaced. It would the
# moment anyone did. See .github/dependabot.yml's ignore list, added
# after this, for why this pairing needs a human to bump it, not a bot.
wasmtime-wasi = "=36.0.15"

[dev-dependencies]
# The `wat` feature (WAT text-format parsing) is dev-only on purpose:
# production Tier A loading always goes through real `.wasm` binaries
# (see docs/roadmap/v0.0.3-roadmap.md's `.cwasm`-is-a-cache-artifact,
# `.wasm`-is-canonical note), so nothing in `src/` needs it. This
# crate's tests use inline WAT fixtures instead of an external
# `cargo-component`/`wit-bindgen` toolchain -- see `tier_a.rs`'s test
# module docs. Cargo unifies this feature in for `cargo test` builds
# without it affecting `cargo build --release`.
wasmtime = { version = "=36.0.15", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
# Used directly in tier_a.rs's tests (wat::parse_str), not just pulled
# in transitively via wasmtime's own "wat" feature above -- needs an
# explicit dependency entry. Left unpinned (unlike the old =1.207.0)
# since nothing here requires rustc 1.75 anymore; cargo resolves
# whatever's compatible with wasmtime 36.x's own wat requirement.
wat = "1"
