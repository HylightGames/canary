[package]
name = "canary-plugin-api"
description = "Canary Engine plugin trait surface and native (Tier B) plugin loader."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2.0.19"
canary-ecs = { path = "../canary-ecs" }
# Pinned below latest for this sandbox's validation build: libloading's own
# latest release (0.9.0) has raised its MSRV to rustc 1.88, newer than the
# apt-installed rustc 1.75 available here (see
# docs/development/build-system.md and the analogous note in
# engine/canary-ecs/Cargo.toml). 0.8.6 is the newest release still
# compatible with 1.75. Bump once building against a current `stable`
# toolchain.
libloading = "=0.8.6"

# Tier A (WASM Component Model / WASI 0.2) loader, v0.0.3. wasmtime 21.0.2
# is the newest release confirmed, empirically (a real `cargo build`, not
# just its declared rust-version), to compile under this sandbox's
# apt-installed rustc 1.75 -- see
# docs/development/build-system.md#the-rustc-175-sandbox-validation-floor
# for why this needed six pins, not one, and what to do once a current
# toolchain is available.
wasmtime = { version = "=21.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = "=21.0.2"
# Transitive-dependency pins required to actually build the above under
# rustc 1.75 -- each independently drifted past that floor through its
# own later releases since wasmtime 21.0.2 was originally published.
idna = "=1.0.3"
idna_adapter = "=1.2.0"
hashbrown = "=0.16.1"
indexmap = "=2.11.4"
litemap = "=0.7.3"

[dev-dependencies]
# The `wat` feature (WAT text-format parsing) is dev-only on purpose:
# production Tier A loading always goes through real `.wasm` binaries
# (see docs/roadmap/v0.0.3-roadmap.md's `.cwasm`-is-a-cache-artifact,
# `.wasm`-is-canonical note), so nothing in `src/` needs it. This
# crate's tests use inline WAT fixtures instead of an external
# `cargo-component`/`wit-bindgen` toolchain -- see `tier_a.rs`'s test
# module docs. Cargo unifies this feature in for `cargo test` builds
# without it affecting `cargo build --release`.
wasmtime = { version = "=21.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
# wat's own pin, for the same rustc-1.75 reason as the others above --
# it drifted independently of wasmtime's core dependency tree.
wat = "=1.207.0"
