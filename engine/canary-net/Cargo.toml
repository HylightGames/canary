[package]
name = "canary-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Server-authoritative replication transport for Canary (QUIC default behind a Canary-owned trait)"

[lints]
workspace = true

[dependencies]
postcard = { version = "1", default-features = false, features = ["use-std"] }
quinn = "0.11"
serde = { version = "1", features = ["derive", "alloc"] }
# SHA-256 for the envelope integrity checksum. `0.11` workspace-wide: the
# same SHA-256 algorithm as the former `0.10` line (no digest-domain
# change; see the envelope checksum test), aligned with `canary-state`
# and `canary-assets` so workspace members resolve one `sha2` major.
# (`wasmtime`'s transitive `sha2 0.10` via `cranelift-codegen` is outside
# workspace control and unaffected by this line.)
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rcgen = "0.13"
