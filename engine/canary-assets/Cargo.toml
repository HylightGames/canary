[package]
name = "canary-assets"
description = "Canary Engine asset loading: AssetId + AssetHandle<T> + AssetStore<T> + AssetError. See docs/architecture/asset-system.md and ADR 0018."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
canary-ecs = { path = "../canary-ecs" }
thiserror = "2.0.19"

# Content-hash backend for `AssetId` (ADR 0018: opaque hash of file bytes +
# loader version). Chose `sha2 0.10.x` over `blake3` after a real spike build
# on this toolchain (rustc 1.98.1, 2026-09-19): `sha2 0.10.9` compiles clean
# with a tiny pure-Rust transitive tree (digest, block-buffer, generic-array,
# typenum, crypto-common, cpufeatures, cfg-if — confirmed via `cargo tree`,
# no build scripts, no C compiler needed), while `blake3` drags in `cc`
# compilation plus platform SIMD paths this release's kilobyte fixtures do
# not need. NOT `sha2 0.11`: that major declares `edition = "2024"`, the
# hard parse-time wall documented in
# docs/development/build-system.md#the-rustc-175-sandbox-validation-floor
# (same wall that forced the `block-buffer`/`ignore`/`globset` pins there).
sha2 = "0.10"

# Mesh source parsing (Phase 2, ADR 0018: GLB for meshes). `default-features
# = false` plus only `utils` is deliberate, verified by a real spike build +
# `cargo tree` on this toolchain (rustc 1.98.1, 2026-09-19): the `import`
# feature unconditionally pulls `image 0.25` (moxcms, pxfm, zune-jpeg, ...)
# plus `base64` + `urlencoding` — the exact format-breadth bloat ADR 0018
# rejected when it rejected the full `image` crate — while `utils = []`
# pulls nothing further and is what gates the `primitive.reader()` API this
# loader is built on. A self-contained GLB needs no more: `Gltf::from_slice`
# exposes the BIN chunk as `blob`, and `reader()` maps 1:1 onto `Mesh`.
# Files needing what was declined (external buffer URIs, base64 data URIs,
# which is what `import` would have resolved) fail with a typed error
# instead of silently resolving. Minimal tree confirmed: byteorder,
# gltf-json (+proc-macro stack), lazy_static, serde_json only.
# `gltf 1.4.1` declares rust-version 1.61; no edition2024 wall.
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }

# Texture source decoding (Phase 2, ADR 0018: PNG via the pure-Rust `png`
# crate, not the full `image` crate). Verified by the same spike build +
# `cargo tree`: bitflags, crc32fast, fdeflate, flate2, miniz_oxide (x2),
# simd-adler32, adler2, cfg-if — all pure Rust, no build scripts, no C
# compiler. `png 0.18.1` carries no default features to trim (only opt-in
# `benchmarks`/`unstable`/`zlib-rs`), so a plain version requirement is
# already the minimal set.
png = "0.18.1"

[dev-dependencies]
# Mirrors engine/canary-ecs's `proptest = "=1.4.0"` pin exactly (same
# rationale comment lives there): reuses the already-locked 1.4.0
# resolution so no new version enters Cargo.lock, and stays under the
# sandbox floor the workspace still validates against (see
# docs/development/build-system.md). Used for the store's
# generational-aliasing property test (in the same `proptest!` style as
# the ECS entity-aliasing test this handle/store shape was copied from)
# plus the Phase-10 bounded parser fuzz (GLB/PNG byte mutations) and
# AssetId totality/round-trip properties.
proptest = "=1.4.0"
