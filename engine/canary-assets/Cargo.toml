[package]
name = "canary-assets"
description = "Canary Engine asset loading: AssetId + AssetHandle<T> + AssetStore<T> + AssetError. See docs/architecture/asset-system.md and ADR 0018."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
canary-ecs = { path = "../canary-ecs" }
thiserror = "2.0.19"

# Content-hash backend for `AssetId` (ADR 0018: opaque hash of file bytes +
# loader version). Chose `sha2` over `blake3` after a real spike build
# on this toolchain (rustc 1.98.1, 2026-09-19): `sha2` compiles clean
# with a tiny pure-Rust transitive tree (digest, block-buffer, generic-array,
# typenum, crypto-common, cpufeatures, cfg-if — confirmed via `cargo tree`,
# no build scripts, no C compiler needed), while `blake3` drags in `cc`
# compilation plus platform SIMD paths this release's kilobyte fixtures do
# not need. 2026-09: moved `0.10.9` to `0.11` (same SHA-256 algorithm
# either way, so no hash-stability impact; the old `edition2024`
# objection was a pre-1.91 sandbox-cargo wall, irrelevant on this
# toolchain — see `docs/development/build-system.md` History).
sha2 = "0.11"

# Mesh source parsing (Phase 2, ADR 0018: GLB for meshes). `default-features
# = false` plus only `utils` is deliberate, verified by a real spike build +
# `cargo tree` on this toolchain (rustc 1.98.1, 2026-09-19): the `import`
# feature unconditionally pulls `image 0.25` (moxcms, pxfm, zune-jpeg, ...)
# plus `base64` + `urlencoding` — the exact format-breadth bloat ADR 0018
# rejected when it rejected the full `image` crate — while `utils = []`
# pulls nothing further and is what gates the `primitive.reader()` API this
# loader is built on. A self-contained GLB needs no more: `Gltf::from_slice`
# exposes the BIN chunk as `blob`, and `reader()` maps 1:1 onto `Mesh`.
# Files needing what was declined (external buffer URIs, base64 data URIs,
# which is what `import` would have resolved) fail with a typed error
# instead of silently resolving. Minimal tree confirmed: byteorder,
# gltf-json (+proc-macro stack), lazy_static, serde_json only.
# `gltf 1.4.1` declares rust-version 1.61; no edition2024 wall.
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }

# Texture source decoding (Phase 2, ADR 0018: PNG via the pure-Rust `png`
# crate, not the full `image` crate). Verified by the same spike build +
# `cargo tree`: bitflags, crc32fast, fdeflate, flate2, miniz_oxide (x2),
# simd-adler32, adler2, cfg-if — all pure Rust, no build scripts, no C
# compiler. `png 0.18.1` carries no default features to trim (only opt-in
# `benchmarks`/`unstable`/`zlib-rs`), so a plain version requirement is
# already the minimal set.
png = "0.18.1"

# Sound source decoding (v0.0.12 audio milestone: WAV + Ogg Vorbis,
# feeding a future `canary-audio` crate through `AssetHandle<Sound>`).
# `hound` (WAV) and `lewton` (Vorbis) were chosen over Symphonia after a
# license check on this toolchain (2026-09-25, via `cargo info`):
# `hound 3.5.1` is Apache-2.0, `lewton 0.10.2` is MIT OR Apache-2.0 —
# both inside the workspace's MIT/Apache-2.0-only policy for decoder
# dependencies — while Symphonia is MPL-2.0 and is therefore declined
# here regardless of its wider format reach. Both are pure Rust with no
# build scripts and no C compiler needed. Exact `=` pins (per the
# `unic-langid-macros = "=0.9.5"` precedent in
# `docs/development/build-system.md`): the Ogg fixture assertions pin
# lossy-decoder output values, so even a patch bump must arrive as an
# intentional change with re-verified expectations, not silent drift.
hound = "=3.5.1"
lewton = "=0.10.2"

[dev-dependencies]
divan = { version = "5", package = "codspeed-divan-compat" }
# Property tests for the store's generational-aliasing behavior, the
# Phase-10 bounded parser fuzz (GLB/PNG byte mutations), and AssetId
# totality/round-trip properties.
proptest = "1"

# Synthetic PNG fixtures for `benches/assets.rs`, written to a temporary
# directory rather than read from `tests/fixtures/` (those are Git-LFS
# objects; a benchmark measuring pointer text instead of image bytes
# would be silently meaningless).
tempfile = "3"

[[bench]]
name = "assets"
harness = false
