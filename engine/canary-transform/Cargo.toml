[package]
name = "canary-transform"
description = "Canary Engine spatial transforms: local Transform, cached GlobalTransform, hierarchy, and propagation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

homepage.workspace = true
documentation = "https://docs.rs/canary-transform"
readme = "README.md"

[lints]
workspace = true

[dependencies]
canary-ecs = { path = "../canary-ecs", version = "0.0.16" }
canary-scheduler = { path = "../canary-scheduler", version = "0.0.16" }
glam = "0.34"
# Typed validation errors (workspace convention: `thiserror`, never strings).
thiserror = "2"

[dev-dependencies]
divan = { version = "5", package = "codspeed-divan-compat" }

[[bench]]
name = "transform"
harness = false
