[package]
name = "canary-render-ecs"
description = "Canary Engine ECS-to-render bridge: extract renderables from the World, CPU-bake frames, and draw through canary-render."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
canary-ecs = { path = "../canary-ecs" }
canary-scheduler = { path = "../canary-scheduler" }
canary-transform = { path = "../canary-transform" }
canary-render = { path = "../canary-render" }
glam = "0.30"

[dev-dependencies]
# Real backend + WGSL->SPIR-V for this crate's own `#[ignore]`-gated
# offscreen readback tests only -- mirrors engine/canary-render-vulkan's
# dev-deps (same `naga = "=22.1.0"` + `indexmap = "=2.11.4"` pins; see that
# crate's Cargo.toml for why the pins exist). The bridge itself never needs
# naga: `RENDER_WGSL` is compiled here in the test harness, exactly like
# `hello_triangle` does.
canary-render-vulkan = { path = "../canary-render-vulkan" }
naga = { version = "=22.1.0", features = ["wgsl-in", "spv-out"] }
indexmap = "=2.11.4"
