[package]
name = "canary-ui-egui"
description = "Canary Engine egui adapter: translates normalized platform input into egui, builds HUD widgets through the canary-ui-core traits, and converts tessellated output to renderer-independent paint data."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

homepage.workspace = true
documentation = "https://docs.rs/canary-ui-egui"
readme = "README.md"

[lints]
workspace = true

[dependencies]
canary-platform = { path = "../canary-platform", version = "0.0.16" }
canary-render = { path = "../canary-render", version = "0.0.16" }
canary-ui-core = { path = "../canary-ui-core", version = "0.0.16" }
egui = "0.37"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
# Pixel proof for the RHI submit path only (see tests/ui_paint_pixels.rs):
# a real device plus WGSL -> SPIR-V, the same confirmed-minimal naga pin
# set canary-render-vulkan's own proof tests and examples use.
canary-render = { path = "../canary-render", version = "0.0.16" }
canary-render-vulkan = { path = "../canary-render-vulkan", version = "0.0.16" }
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
