[package]
name = "canary-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authored project state and deterministic simulation snapshots for Canary"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive", "alloc"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
# SHA-256 for snapshot checksums. `0.11` workspace-wide (same algorithm as
# the former `0.10` line, so no `AssetId`/checksum stability impact;
# aligned with `canary-net` and `canary-assets` so workspace members
# resolve one `sha2` major — see `docs/development/build-system.md`
# History for the `0.10` → `0.11` retirement).
sha2 = "0.11"
getrandom = "0.3"
thiserror = "2"
