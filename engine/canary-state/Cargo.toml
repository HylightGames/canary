[package]
name = "canary-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authored project state and deterministic simulation snapshots for Canary"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive", "alloc"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
sha2 = "0.10"
getrandom = "0.3"
thiserror = "2"
