version: 2
updates:
  # Rust dependencies (Cargo.toml / Cargo.lock)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Patch/minor updates are grouped into one low-risk PR per week.
      # Major-version bumps are deliberately excluded from this group (see
      # below) and get their own individual PRs instead -- this project
      # already hit real MSRV/dependency-version friction per release
      # (see docs/development/build-system.md History: floor pins for
      # proptest/libloading/tempfile in v0.0.1, the wasmtime 21->36 jump,
      # the fluent-0.17 hold), so bundling a major bump in with routine
      # patch updates is a real, not hypothetical, risk here specifically.
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # No per-dependency ignores: the rustc-1.75 floor-pin era ended
    # 2026-09 (see docs/development/build-system.md History section).
    # Every dependency is now a normal caret requirement resolving to
    # latest-compatible, so Dependabot has nothing it must avoid. Two
    # standing rules for whoever reviews its PRs:
    #   - Paired releases move together or not at all (`unic-langid` /
    #     `unic-langid-impl`, `-macros` / `-macros-impl`; `wasmtime` /
    #     `wasmtime-wasi` if the latter ever becomes a dependency again
    #     -- a past automated bump moved only one of a pair and Cargo
    #     silently resolved a second copy).
    #   - `fluent` stays on 0.16 until an ADR migrates the crate's public
    #     locale type off unic-langid (0.17's langneg moved to icu_locid);
    #     close/decline any 0.17+ proposal with that pointer. `sha2`
    #     likewise stays 0.10 (same SHA-256; see
    #     engine/canary-assets/Cargo.toml).
    # Majors are excluded from the group below and arrive as individual
    # PRs -- same reasoning as ever: this project already hit real
    # MSRV/dependency-version friction per release (see build-system.md
    # History), so a major bump always gets its own verification, never
    # a ride-along with routine patches.
    labels:
      - "type:enhancement"
      - "topic:core"
    commit-message:
      prefix: "deps"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "type:enhancement"
      - "topic:build-system"
    commit-message:
      prefix: "ci"
