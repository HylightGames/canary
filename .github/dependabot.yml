version: 2
updates:
  # Rust dependencies (Cargo.toml / Cargo.lock)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Patch/minor updates are grouped into one low-risk PR per week.
      # Major-version bumps are deliberately excluded from this group (see
      # below) and get their own individual PRs instead -- this project
      # already hit real MSRV/dependency-version friction while building
      # v0.0.1 (proptest, libloading, and tempfile all needed pinning
      # below their latest major/minor release; see the comments in
      # engine/canary-ecs/Cargo.toml and engine/canary-plugin-api/Cargo.toml),
      # so bundling a major bump in with routine patch updates is a real,
      # not hypothetical, risk here specifically.
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Every package below is pinned with an exact ("=") version somewhere
    # in this workspace specifically because its own newer releases
    # already violate this sandbox's rustc-1.75 validation floor (see
    # docs/development/build-system.md#the-rustc-175-sandbox-validation-floor
    # for the full reasoning behind each). These are floor pins tied to
    # an external toolchain constraint dependabot has no way to know
    # about -- unlike ordinary dependencies, even a routine patch bump
    # here is a real, proven risk, not a hypothetical one: an earlier
    # attempt at exactly this kind of "safe" grouped patch/minor bump
    # (PR #5) silently reintroduced multiple already-fixed MSRV breaks in
    # one pass (unic-langid-impl and unic-langid-macros-impl both moved
    # to 0.9.6, which calls the rustc-1.82-only `Option::is_none_or`;
    # rustc-hash moved to 2.1.3, which needs rustc 1.77+), and PR #6
    # bumped wasmtime-wasi alone, ahead of wasmtime, which the upstream
    # project releases in lockstep specifically so their types stay
    # compatible with each other.
    #
    # Fully ignored (no `update-types` filter), not just excluded from
    # the group above: these need a human to re-verify the *specific*
    # newer version against this sandbox before bumping, the same
    # empirical process documented in build-system.md for the original
    # pin -- not a version range dependabot can safely widen on its own.
    # Revisit removing an entry once this sandbox's rustc floor moves
    # past the version that entry's newer releases need.
    ignore:
      # wasmtime family (v0.0.3, Tier A WASM loading) -- wasmtime and
      # wasmtime-wasi must move together; idna/idna_adapter/hashbrown/
      # indexmap/litemap are wasmtime's own transitive floor pins.
      - dependency-name: "wasmtime"
      - dependency-name: "wasmtime-wasi"
      - dependency-name: "wat"
      - dependency-name: "idna"
      - dependency-name: "idna_adapter"
      - dependency-name: "hashbrown"
      - dependency-name: "litemap"
      # v0.0.1 floor pins (canary-ecs/canary-plugin-api).
      - dependency-name: "libloading"
      - dependency-name: "proptest"
      - dependency-name: "tempfile"
      # winit/Wayland family (v0.0.4, real windowing).
      - dependency-name: "wayland-protocols"
      - dependency-name: "wayland-protocols-plasma"
      - dependency-name: "wayland-protocols-wlr"
      - dependency-name: "wayland-scanner"
      - dependency-name: "quick-xml"
      - dependency-name: "block-buffer"
      - dependency-name: "ignore"
      - dependency-name: "globset"
      - dependency-name: "rust-embed"
      - dependency-name: "rust-embed-impl"
      - dependency-name: "rust-embed-utils"
      # fluent-rs / unic-langid family (v0.0.5, localization) --
      # unic-langid and unic-langid-impl must move together, likewise
      # unic-langid-macros and unic-langid-macros-impl; rustc-hash is
      # shared with the naga pin below.
      - dependency-name: "rustc-hash"
      - dependency-name: "unic-langid"
      - dependency-name: "unic-langid-impl"
      - dependency-name: "unic-langid-macros"
      - dependency-name: "unic-langid-macros-impl"
      # Rendering (v0.0.6) -- naga and indexmap are shared with the
      # wasmtime family's own indexmap pin above; only one entry needed.
      - dependency-name: "naga"
      - dependency-name: "indexmap"
    labels:
      - "type:enhancement"
      - "topic:core"
    commit-message:
      prefix: "deps"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "type:enhancement"
      - "topic:build-system"
    commit-message:
      prefix: "ci"
