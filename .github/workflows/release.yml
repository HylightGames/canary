name: Release

# Triggered by pushing an annotated version tag (e.g. `git push origin
# v0.0.2`), following the versioning scheme in ADR 0006. Publishes a
# GitHub Release using this repository's own docs/release-notes/<tag>.md as
# the release body -- the same file a human reads, not a duplicated
# description maintained separately.
#
# Deliberately does NOT attach built binaries yet: there is nothing a
# user would meaningfully download and run at this stage of the project
# (canary-runtime is a boot-harness proof, not a deliverable). This
# workflow's job today is "verify the tag builds cleanly, then publish
# the release notes" -- the natural place to add artifact upload later is
# a new step in the `build` job below, once there's something real to
# attach.

on:
  push:
    tags:
      - "v*"

# Least privilege default: the `build` job below only checks out code
# and runs local cargo commands. The `publish` job declares its own
# `contents: write` (needed to create the GitHub Release), which
# overrides this default for that job only.
permissions:
  contents: read

jobs:
  build:
    name: Verify release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # Same as ci.yml: LFS fixtures must resolve to real bytes or
          # the `cargo test --release` below reads pointer text instead.
          lfs: true
      - name: cargo build --workspace --release
        run: cargo build --locked --workspace --release
      - name: cargo test --workspace --release
        run: cargo test --locked --workspace --release

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release notes file for this tag
        id: notes
        run: |
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::No $NOTES_FILE found; falling back to an auto-generated release body. Add one before tagging future releases, per docs/reviews/RELEASE_CHECKLIST.md."
          fi
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path || null }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-pre') }}
