name: CI

# Cross-platform-by-design is a stated pillar (docs/vision/project-goals.md),
# so CI builds on all three desktop OSes from the very first commit rather
# than bolting that on later once something has quietly become Linux-only.

on:
  push:
    branches: [stable, dev]
  pull_request:
    branches: [stable, dev]

# Least privilege: every job here only checks out code and runs local
# build/test commands, so read-only contents suffices for all of them.
# (A job needing more must declare its own `permissions:` block, which
# overrides this default.)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT setting a blanket RUSTFLAGS="-D warnings" here.
  # RUSTFLAGS applies to every rustc invocation Cargo makes, including
  # third-party dependencies -- a new compiler release can add a lint
  # that fires inside a dependency's own code (which this project
  # doesn't own and can't fix), turning that into a CI failure this
  # project didn't cause. The workspace [lints] table in Cargo.toml is
  # correctly scoped to workspace members only, and `cargo clippy
  # --workspace -- -D warnings` below is likewise scoped to this
  # project's own crates. See docs/reviews/2026-08-senior-architecture-review.md,
  # Finding 2.1, and docs/reviews/risk-register.md, R-02.

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install Rust
        run: rustup component add rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  lint-and-test:
    name: Build, lint, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install Rust
        run: rustup component add clippy
      # Linux only: winit's X11/Wayland backends need these at compile
      # time (not just runtime) -- see engine/canary-platform/Cargo.toml's
      # winit-backend feature docs. libasound2-dev is the same class of
      # dependency for canary-audio: rodio's playback feature builds on
      # cpal's ALSA backend, whose alsa-sys build script probes
      # pkg-config alsa at compile time (ADR 0023).
      - name: Install X11/Wayland dev libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxrandr-dev libxi-dev libxcursor-dev pkg-config libasound2-dev
      - name: cargo build --workspace
        run: cargo build --locked --workspace --all-targets
      - name: cargo clippy --workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo test --locked --workspace
        run: cargo test --locked --workspace
      # Separate steps (not folded into the ones above) so a winit-backend
      # regression on any OS is attributed clearly, and so the default
      # (most common) configuration's results aren't muddied by a second
      # feature set in the same log. Feature-gated per
      # docs/architecture/physics.md's and ADR 0016's "not privileged,
      # not in the build unless used" pattern -- applied here too (see
      # canary-platform/Cargo.toml) -- so this is checked deliberately on
      # all three OSes rather than assumed to keep working since it's
      # off by default.
      - name: cargo build --workspace --features winit-backend
        run: cargo build --locked --workspace --all-targets --features canary-platform/winit-backend
      - name: cargo clippy --workspace --features winit-backend
        run: cargo clippy --locked --workspace --all-targets --features canary-platform/winit-backend -- -D warnings
      - name: cargo test --locked --workspace --features winit-backend
        run: cargo test --locked --workspace --features canary-platform/winit-backend

  release-gate:
    name: v0.1.0 release gate (headless proof)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Linux-only automated release gate for the v0.1.0 integration proof:
    # every step here is display-free (no GPU, no X server, no audio
    # device). The windowed software-Vulkan/Xvfb smoke
    # (`cargo run -p collectathon --bin collectathon -- 600`) and the
    # real-device/audio evidence stay manual by design -- this gate must
    # not fail on a headless runner.
    steps:
      - uses: actions/checkout@v7
        with:
          # Collectathon fixtures are regular blobs (see .gitattributes);
          # kept so every job checks out the same tree.
          lfs: true
      - name: Install Rust
        run: rustup toolchain install stable
      # Same compile-time deps as lint-and-test: collectathon builds on
      # canary-platform/winit-backend (X11/Wayland headers) and
      # canary-audio (ALSA headers, ADR 0023) even for headless runs.
      # No Xvfb, no Vulkan ICD: nothing here opens a display or device.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxrandr-dev libxi-dev libxcursor-dev pkg-config libasound2-dev
      - name: Asset fixture check (fail fast on missing/corrupt bytes)
        # Fail-fast guard ahead of the loader runs: every fixture the
        # public loaders read must exist, must not be a Git-LFS pointer
        # (the PNG-class regression that motivated this gate), and must
        # carry its format magic. The decoders themselves run for real in
        # the headless/server steps below (`load_game_assets` + `load_room`
        # exit nonzero on any undecodable file via typed
        # AssetError/StateError), so this guard plus those runs is the
        # full missing/corrupt-fixture gate.
        run: |
          set -euo pipefail
          dir=examples/collectathon/assets
          for fixture in quad.glb box.glb rgba2x2.png pickup.wav room.json; do
            test -f "$dir/$fixture" || { echo "::error ::missing fixture $dir/$fixture"; exit 1; }
            if head -c 128 "$dir/$fixture" | grep -q "git-lfs.github.com"; then
              echo "::error ::$dir/$fixture holds a Git-LFS pointer, not fixture bytes"
              exit 1
            fi
          done
          python3 - <<"EOF"
          import json
          from pathlib import Path
          root = Path("examples/collectathon/assets")
          def magic(name, want):
              data = (root / name).read_bytes()
              assert data[: len(want)] == want, f"{name}: bad magic {data[:16]!r}"
              print(f"{name}: {len(data)} bytes, magic ok")
          magic("rgba2x2.png", b"\x89PNG\r\n\x1a\n")
          magic("quad.glb", b"glTF")
          magic("box.glb", b"glTF")
          wav = (root / "pickup.wav").read_bytes()
          assert wav[:4] == b"RIFF" and wav[8:12] == b"WAVE", "pickup.wav: bad RIFF/WAVE magic"
          print(f"pickup.wav: {len(wav)} bytes, RIFF/WAVE ok")
          room = json.loads((root / "room.json").read_text())
          print(f"room.json: parses as JSON ({len(room)} top-level keys)")
          EOF
      - name: Deterministic headless smoke (90 frames, score 1, 1/4)
        # The headless twin IS the public-loader run over
        # examples/collectathon/assets, and it needs no display or sound
        # card (HeadlessWindow, NullBackend, decode-only audio). The
        # summary-line asserts pin the deterministic baseline (hold-left
        # from frame 0, collect edge frame 33, release frame 60).
        run: |
          set -eu
          cargo run --locked -p collectathon --bin collectathon_headless 2>&1 | tee headless.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "score 1 collected 1/4" headless.log
          grep -q "after 90 frames" headless.log
      - name: Server/client loopback (QUIC handshake to ack)
        # Display-free (UDP loopback only, no window/GPU/audio): the
        # server binds 127.0.0.1:0, prints `READY <addr> <identity-dir>`,
        # serves one session, and exits; the client converges on the
        # snapshot, applies the delta, submits frame-tagged input, awaits
        # the ack, and disconnects. Pre-built first so the READY wait
        # below measures serve time, not compile time.
        run: |
          set -eu
          cargo build --locked -p collectathon --bins
          id_dir="$RUNNER_TEMP/collectathon-id"
          mkdir -p "$id_dir"
          rm -f server.log client.log server.pid
          cargo run --locked -p collectathon --bin collectathon_server -- --bind 127.0.0.1:0 --identity-dir "$id_dir" > server.log 2>&1 &
          echo $! > server.pid
          ready=""
          for _ in $(seq 1 120); do
            if grep -q "^READY " server.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "::error ::replication server exited before printing READY"
              cat server.log
              exit 1
            fi
            sleep 1
          done
          test -n "$ready" || { echo "::error ::replication server never printed READY"; cat server.log; exit 1; }
          server_addr="$(grep "^READY " server.log | head -n 1 | awk '{print $2}')"
          test -n "$server_addr"
          cargo run --locked -p collectathon --bin collectathon_client -- --server "$server_addr" --cert "$id_dir/server.der" 2>&1 | tee client.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "snapshot converged" client.log
          grep -q "delta applied" client.log
          grep -q "ack seq=1" client.log
          grep -q "clean disconnect" client.log
          wait "$(cat server.pid)"
      - name: Collab CLI (two-client shared edit, in-process)
        # Display-free (in-process CollabSessionHost over temp files: no
        # window/GPU/audio/network): owner accept, reader deny, stale
        # conflict with refresh, rebased accept, sync tail, plus the
        # gameplay-separation assert -- all inside the binary, which exits
        # nonzero on any deviation.
        run: |
          set -eu
          cargo run --locked -p collectathon --bin collectathon_collab_client 2>&1 | tee collab.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "two-client run converged" collab.log

  windowing-integration:
    name: Real windowing integration test (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Linux-only: this exercises canary-platform's winit-backend against
    # a live (if virtual) X11 display -- window creation, redraw/resize,
    # real synthesized keyboard input via XTEST, and a real
    # WM_DELETE_WINDOW close signal -- none of which the `lint-and-test`
    # matrix above actually runs (it only confirms the feature builds
    # and its unit tests pass, since it has no display available). An
    # equivalent macOS/Windows job is real, intended future work, not
    # fixed here -- see engine/canary-platform/tests/winit_backend_window.rs's
    # own module docs.
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install Rust
        run: rustup toolchain install stable
      - name: Install X11 dev libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libxrandr-dev libxi-dev libxcursor-dev pkg-config xvfb
      - name: Run the real windowing integration test under Xvfb
        run: >
          xvfb-run --auto-servernum
          cargo test --locked -p canary-platform --features winit-backend
          --test winit_backend_window -- --ignored

  rendering-integration:
    name: Real Vulkan rendering integration test (llvmpipe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Linux-only, same reasoning as windowing-integration above: this
    # exercises canary-render-vulkan against a real (if software) Vulkan
    # device -- a WGSL shader compiled to SPIR-V, an actual offscreen
    # render, and a readback asserted against real pixel values -- none
    # of which `lint-and-test` above actually runs, since no CI runner
    # has a real GPU and no Vulkan ICD is installed by default. Previously
    # this test ran unguarded inside `cargo test --locked --workspace` on every OS
    # in that matrix, which is why it failed there instead of being
    # skipped: see this test's own module docs (`#[ignore]`d, same
    # pattern as `winit_backend_window.rs`).
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install Rust
        run: rustup toolchain install stable
      - name: Install a software Vulkan ICD (Mesa llvmpipe/lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Install X11 dev libraries and Xvfb (for the presentation proof)
        # Same set as the windowing-integration job: building winit's x11
        # backend needs these, and present_clear needs a live X11 display.
        run: |
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libxrandr-dev libxi-dev libxcursor-dev pkg-config xvfb
      - name: Run the real Vulkan rendering integration tests
        # Scoped to explicit test targets (not whole-crate `--ignored`):
        # any future `#[ignore]` (e.g. a quarantined flake) must opt
        # into this llvmpipe gate deliberately, not join it silently.
        run: >
          cargo test --locked -p canary-render-vulkan
          --test hello_triangle -- --ignored &&
          cargo test --locked -p canary-render-vulkan
          --test texture_binding_misuse -- --ignored &&
          cargo test --locked -p canary-render-vulkan
          --test chaos -- --ignored &&
          cargo test --locked -p canary-render-vulkan
          --test blended_textured_pipeline -- --ignored &&
          cargo test --locked -p canary-ui-egui
          --test ui_paint_pixels -- --ignored
      - name: Run the windowed presentation proof (llvmpipe + Xvfb)
        # present_clear is the v0.0.13 presentation-seam proof: steady
        # frames, minimize/restore, resize-recreate, content blit,
        # destruction order. It needs the `presentation` feature (off by
        # default, so without it the target compiles to zero tests and
        # reports a vacuous pass) plus a live X11 display and a presenting
        # ICD — mesa lavapipe qualifies for both.
        run: >
          xvfb-run --auto-servernum
          cargo test --locked -p canary-render-vulkan
          --features presentation
          --test present_clear -- --ignored

  render-ecs-integration:
    name: Real ECS-driven rendering integration test (llvmpipe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same reasoning as rendering-integration above: this exercises
    # canary-render-ecs's bridge (extract + CPU-bake + draw) against a
    # real (if software) Vulkan device -- multi-entity scenes, moved-
    # entity redraws, and empty-scene clears asserted against real
    # pixel values. These tests are `#[ignore]`-gated like
    # hello_triangle (no Vulkan ICD on the default runners), so without
    # this job nothing in CI would ever run them.
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install Rust
        run: rustup toolchain install stable
      - name: Install a software Vulkan ICD (Mesa llvmpipe/lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Run the real ECS-driven rendering integration tests
        # Scoped to explicit test targets (not whole-crate `--ignored`):
        # any future `#[ignore]` (e.g. a quarantined flake) must opt
        # into this llvmpipe gate deliberately, not join it silently.
        run: >
          cargo test --locked -p canary-render-ecs
          --test render_ecs_readback -- --ignored &&
          cargo test --locked -p canary-render-ecs
          --test physics_game_proof -- --ignored

  wasm-target-check:
    name: WASM component target compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install Rust with wasm32-wasip2
        run: rustup target add wasm32-wasip2
      - name: Check canary-plugin-api on wasm32-wasip2
        run: cargo check --locked -p canary-plugin-api --target wasm32-wasip2

  localization:
    name: Localization lint and compare (moz.l10n)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Phase 1 of the localization pipeline
    # (docs/development/localization-pipeline.md): Mozilla's `moz.l10n`
    # CLI checks every `.ftl` file under `locales/` parses (`lint`) and
    # that each non-default locale covers the default locale's keys
    # (`compare` against `locales/en-US`). No UI strings exist yet, so no
    # `.ftl` files exist yet either -- until the first locale content
    # lands, this job installs the pinned tool, proves it executes
    # (`moz-l10n --version`), and reports the gate as vacuous-active
    # rather than failing on an empty input set. That is deliberate, not
    # theater: environment, pin, and invocation are all exercised on
    # every run, so the first real `.ftl` commit gets a working gate
    # with zero further CI changes.
    # No new permissions needed: pip-installing a PyPI package and
    # reading the checkout requires nothing beyond the top-level
    # `contents: read` this job inherits.
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install pinned moz.l10n (system python3)
        run: |
          # ubuntu-latest runners ship CPython 3 as `python3` -- no
          # setup-python action needed and no third-party actions added.
          # Hash-pinned (`--require-hashes`) so a compromised or drifted
          # wheel fails loudly: versions + hashes live in
          # .github/moz-l10n-requirements.txt (recorded 2026-09-20),
          # bumped deliberately, never relaxed.
          python3 -m pip install --require-hashes -r .github/moz-l10n-requirements.txt
      - name: Lint and compare locales (or report vacuous-active)
        run: |
          if [ -n "$(find locales -name '*.ftl' -print -quit 2>/dev/null)" ]; then
            # Quoted glob, expanded by `moz-l10n` itself (which supports
            # `**`): a bare `locales/` directory argument only visits
            # files mirroring the reference locale's layout -- verified
            # against moz.l10n 0.14.2, where an extra broken file in a
            # non-reference locale was silently skipped -- so the glob is
            # what makes this a real parse gate. Exits nonzero on any
            # file that fails to parse.
            moz-l10n lint 'locales/**/*.ftl'
            # `compare` only reports (it exits 0 even with keys missing --
            # verified), so the gate is enforced here: any key present in
            # the default locale but absent from another locale, or any
            # per-file error, fails the job with a file-annotated
            # `::error ::` line. en-US is the source of truth (the locale
            # development happens in -- see
            # docs/architecture/localization.md).
            for locale_dir in locales/*/; do
              [ -d "$locale_dir" ] || continue
              [ "$locale_dir" = "locales/en-US/" ] && continue
              moz-l10n compare --json "$locale_dir" --source locales/en-US | python3 -c "
          import json, sys
          report = json.load(sys.stdin)
          failed = False
          for locale, result in report.items():
              for path, msgs in (result.get('missing') or {}).items():
                  failed = True
                  print(f'::error ::{locale}/{path} missing {len(msgs)} key(s) vs locales/en-US')
              for path, err in (result.get('errors') or {}).items():
                  failed = True
                  print(f'::error ::{locale}/{path}: {err}')
          sys.exit(1 if failed else 0)
          "
            done
          else
            # No `.ftl` content yet: prove the installed tool itself runs,
            # then say so explicitly. The gate engages on the first locale
            # content commit with no CI changes required.
            moz-l10n --version
            echo "localization gate vacuous-active: no .ftl files under locales/ yet; lint+compare engage on first locale content."
          fi
