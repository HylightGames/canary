name: CI

# Cross-platform-by-design is a stated pillar (docs/vision/project-goals.md),
# so CI builds on all three desktop OSes from the very first commit rather
# than bolting that on later once something has quietly become Linux-only.

on:
  push:
    branches: [stable, dev]
  pull_request:
    branches: [stable, dev]

# Least privilege: every job here only checks out code and runs local
# build/test commands, so read-only contents suffices for all of them.
# (A job needing more must declare its own `permissions:` block, which
# overrides this default.)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT setting a blanket RUSTFLAGS="-D warnings" here.
  # RUSTFLAGS applies to every rustc invocation Cargo makes, including
  # third-party dependencies -- a new compiler release can add a lint
  # that fires inside a dependency's own code (which this project
  # doesn't own and can't fix), turning that into a CI failure this
  # project didn't cause. The workspace [lints] table in Cargo.toml is
  # correctly scoped to workspace members only, and `cargo clippy
  # --workspace -- -D warnings` below is likewise scoped to this
  # project's own crates. See docs/reviews/2026-08-senior-architecture-review.md,
  # Finding 2.1, and docs/reviews/risk-register.md, R-02.

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install Rust
        run: rustup component add rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  lint-and-test:
    name: Build, lint, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install Rust
        run: rustup component add clippy
      # Linux only: winit's X11/Wayland backends need these at compile
      # time (not just runtime) -- see engine/canary-platform/Cargo.toml's
      # winit-backend feature docs.
      - name: Install X11/Wayland dev libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxrandr-dev libxi-dev libxcursor-dev pkg-config
      - name: cargo build --workspace
        run: cargo build --workspace --all-targets
      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace
      # Separate steps (not folded into the ones above) so a winit-backend
      # regression on any OS is attributed clearly, and so the default
      # (most common) configuration's results aren't muddied by a second
      # feature set in the same log. Feature-gated per
      # docs/architecture/physics.md's and ADR 0016's "not privileged,
      # not in the build unless used" pattern -- applied here too (see
      # canary-platform/Cargo.toml) -- so this is checked deliberately on
      # all three OSes rather than assumed to keep working since it's
      # off by default.
      - name: cargo build --workspace --features winit-backend
        run: cargo build --workspace --all-targets --features canary-platform/winit-backend
      - name: cargo clippy --workspace --features winit-backend
        run: cargo clippy --workspace --all-targets --features canary-platform/winit-backend -- -D warnings
      - name: cargo test --workspace --features winit-backend
        run: cargo test --workspace --features canary-platform/winit-backend

  windowing-integration:
    name: Real windowing integration test (Xvfb)
    runs-on: ubuntu-latest
    # Linux-only: this exercises canary-platform's winit-backend against
    # a live (if virtual) X11 display -- window creation, redraw/resize,
    # real synthesized keyboard input via XTEST, and a real
    # WM_DELETE_WINDOW close signal -- none of which the `lint-and-test`
    # matrix above actually runs (it only confirms the feature builds
    # and its unit tests pass, since it has no display available). An
    # equivalent macOS/Windows job is real, intended future work, not
    # fixed here -- see engine/canary-platform/tests/winit_backend_window.rs's
    # own module docs.
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install Rust
        run: rustup toolchain install stable
      - name: Install X11 dev libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libxrandr-dev libxi-dev libxcursor-dev pkg-config xvfb
      - name: Run the real windowing integration test under Xvfb
        run: >
          xvfb-run --auto-servernum
          cargo test -p canary-platform --features winit-backend
          --test winit_backend_window -- --ignored

  rendering-integration:
    name: Real Vulkan rendering integration test (llvmpipe)
    runs-on: ubuntu-latest
    # Linux-only, same reasoning as windowing-integration above: this
    # exercises canary-render-vulkan against a real (if software) Vulkan
    # device -- a WGSL shader compiled to SPIR-V, an actual offscreen
    # render, and a readback asserted against real pixel values -- none
    # of which `lint-and-test` above actually runs, since no CI runner
    # has a real GPU and no Vulkan ICD is installed by default. Previously
    # this test ran unguarded inside `cargo test --workspace` on every OS
    # in that matrix, which is why it failed there instead of being
    # skipped: see this test's own module docs (`#[ignore]`d, same
    # pattern as `winit_backend_window.rs`).
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install Rust
        run: rustup toolchain install stable
      - name: Install a software Vulkan ICD (Mesa llvmpipe/lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Run the real Vulkan rendering integration test
        run: >
          cargo test -p canary-render-vulkan
          --test hello_triangle -- --ignored

  render-ecs-integration:
    name: Real ECS-driven rendering integration test (llvmpipe)
    runs-on: ubuntu-latest
    # Same reasoning as rendering-integration above: this exercises
    # canary-render-ecs's bridge (extract + CPU-bake + draw) against a
    # real (if software) Vulkan device -- multi-entity scenes, moved-
    # entity redraws, and empty-scene clears asserted against real
    # pixel values. These tests are `#[ignore]`-gated like
    # hello_triangle (no Vulkan ICD on the default runners), so without
    # this job nothing in CI would ever run them.
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install Rust
        run: rustup toolchain install stable
      - name: Install a software Vulkan ICD (Mesa llvmpipe/lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Run the real ECS-driven rendering integration tests
        run: >
          cargo test -p canary-render-ecs
          -- --ignored

  wasm-target-check:
    name: WASM component target compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install Rust with wasm32-wasip2
        run: rustup target add wasm32-wasip2
      - name: Check canary-plugin-api on wasm32-wasip2
        run: cargo check -p canary-plugin-api --target wasm32-wasip2

  localization:
    name: Localization lint and compare (moz.l10n)
    runs-on: ubuntu-latest
    # Phase 1 of the localization pipeline
    # (docs/development/localization-pipeline.md): Mozilla's `moz.l10n`
    # CLI checks every `.ftl` file under `locales/` parses (`lint`) and
    # that each non-default locale covers the default locale's keys
    # (`compare` against `locales/en-US`). No UI strings exist yet, so no
    # `.ftl` files exist yet either -- until the first locale content
    # lands, this job installs the pinned tool, proves it executes
    # (`moz-l10n --version`), and reports the gate as vacuous-active
    # rather than failing on an empty input set. That is deliberate, not
    # theater: environment, pin, and invocation are all exercised on
    # every run, so the first real `.ftl` commit gets a working gate
    # with zero further CI changes.
    # No new permissions needed: pip-installing a PyPI package and
    # reading the checkout requires nothing beyond the top-level
    # `contents: read` this job inherits.
    steps:
      - uses: actions/checkout@v7
        with:
          # Fixtures (*.glb/*.png, see .gitattributes) are Git-LFS objects:
          # without this every file-load test fails on pointer bytes.
          lfs: true
      - name: Install pinned moz.l10n (system python3)
        run: |
          # ubuntu-latest runners ship CPython 3 as `python3` -- no
          # setup-python action needed and no third-party actions added.
          # Pinned to ==0.14.2 (checked 2026-09-20: latest on PyPI; the
          # downloaded wheel was verified to provide the `moz-l10n`
          # console script with `lint` and `compare` subcommands).
          python3 -m pip install "moz.l10n==0.14.2"
      - name: Lint and compare locales (or report vacuous-active)
        run: |
          if [ -n "$(find locales -name '*.ftl' -print -quit 2>/dev/null)" ]; then
            # Quoted glob, expanded by `moz-l10n` itself (which supports
            # `**`): a bare `locales/` directory argument only visits
            # files mirroring the reference locale's layout -- verified
            # against moz.l10n 0.14.2, where an extra broken file in a
            # non-reference locale was silently skipped -- so the glob is
            # what makes this a real parse gate. Exits nonzero on any
            # file that fails to parse.
            moz-l10n lint 'locales/**/*.ftl'
            # `compare` only reports (it exits 0 even with keys missing --
            # verified), so the gate is enforced here: any key present in
            # the default locale but absent from another locale, or any
            # per-file error, fails the job with a file-annotated
            # `::error ::` line. en-US is the source of truth (the locale
            # development happens in -- see
            # docs/architecture/localization.md).
            for locale_dir in locales/*/; do
              [ -d "$locale_dir" ] || continue
              [ "$locale_dir" = "locales/en-US/" ] && continue
              moz-l10n compare --json "$locale_dir" --source locales/en-US | python3 -c "
          import json, sys
          report = json.load(sys.stdin)
          failed = False
          for locale, result in report.items():
              for path, msgs in (result.get('missing') or {}).items():
                  failed = True
                  print(f'::error ::{locale}/{path} missing {len(msgs)} key(s) vs locales/en-US')
              for path, err in (result.get('errors') or {}).items():
                  failed = True
                  print(f'::error ::{locale}/{path}: {err}')
          sys.exit(1 if failed else 0)
          "
            done
          else
            # No `.ftl` content yet: prove the installed tool itself runs,
            # then say so explicitly. The gate engages on the first locale
            # content commit with no CI changes required.
            moz-l10n --version
            echo "localization gate vacuous-active: no .ftl files under locales/ yet; lint+compare engage on first locale content."
          fi
