name: Security

# Complements Dependabot (.github/dependabot.yml): Dependabot proposes
# version bumps; this workflow directly checks the current dependency
# tree against the RustSec Advisory Database on every push/PR and on a
# weekly schedule, so a newly-disclosed vulnerability in an existing,
# unchanged dependency is caught even between Dependabot runs.

on:
  push:
    branches: [stable, dev]
  pull_request:
    branches: [stable, dev]
  schedule:
    # Weekly, independent of any code change, since a new advisory can be
    # published for a dependency this repo hasn't touched in months.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Least privilege: this workflow only checks out code and runs a local
# audit command — read-only contents suffices.
permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        # Accepted-warning baseline (zero errors required; warnings need a
        # written reason to stay): RUSTSEC-2026-0192 (`ttf-parser`
        # unmaintained) via owned_ttf_parser <- parry2d <- rapier2d, the
        # canonical 2D backend (ADR 0019). Not manifest-actionable -- only
        # a rapier replacement would move it -- and not a vulnerability,
        # so it stays visible rather than ignored. Revisit if a real
        # advisory lands on this chain or rapier moves off it.
        run: cargo audit
