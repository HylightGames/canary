[workspace]
resolver = "2"
members = [
    "engine/canary-core",
    "engine/canary-platform",
    "engine/canary-ecs",
    "engine/canary-plugin-api",
    "engine/canary-runtime",
    "tools/xtask",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/HylightGames/canary"
homepage = "https://github.com/HylightGames/canary"
readme = "README.md"

# MSRV is intentionally not declared yet.
#
# An MSRV should be established only after the project's dependency graph
# and supported-platform policy make the choice meaningful. When that
# decision is made, document it in an ADR and add `rust-version` here so
# every workspace crate inherits the same floor.

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
