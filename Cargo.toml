[workspace]
resolver = "2"
members = [
    "engine/canary-core",
    "engine/canary-platform",
    "engine/canary-ecs",
    "engine/canary-scheduler",
    "engine/canary-transform",
    "engine/canary-plugin-api",
    "engine/canary-loc",
    "engine/canary-assets",
    "engine/canary-physics",
    "engine/canary-render",
    "engine/canary-render-vulkan",
    "engine/canary-render-ecs",
    "engine/canary-runtime",
    "examples/spinning-cube",
    "tools/xtask",
]

[workspace.package]
version = "0.0.10"
edition = "2021"
license = "MIT"
repository = "https://github.com/HylightGames/canary"
# Deliberately no `rust-version` (MSRV) pin: the workspace tracks current
# `stable` via rustup (see docs/development/build-system.md Toolchain
# policy). The de-facto floor is whatever the heaviest dependency
# requires (wasmtime, currently MSRV 1.95 as of 2026-09). Pick a declared
# MSRV once one of them actually forces the question in a way updating
# can't route around, and record that choice as an ADR rather than
# asserting a number here that hasn't been decided on purpose.

# Shared lint configuration for every crate in the workspace. Individual
# crates inherit this via `[lints] workspace = true` in their own Cargo.toml
# (see docs/development/coding-standards.md).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
