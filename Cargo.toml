[workspace]
resolver = "2"
members = [
    "engine/canary-core",
    "engine/canary-platform",
    "engine/canary-ecs",
    "engine/canary-plugin-api",
    "engine/canary-runtime",
    "tools/xtask",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/HylightGames/canary"
# Deliberately no `rust-version` (MSRV) pin yet: this workspace has been
# validated against Ubuntu's packaged rustc 1.75 in a sandbox without
# rustup access, but that is a floor for *this session's* validation, not a
# considered MSRV policy. Pick a real MSRV once a dependency (wgpu's is
# already known to be newer, per docs/research/technology-evaluations.md)
# actually forces the question, and record that choice as an ADR rather
# than asserting a number here that hasn't been decided on purpose.

# Shared lint configuration for every crate in the workspace. Individual
# crates inherit this via `[lints] workspace = true` in their own Cargo.toml
# (see docs/development/coding-standards.md).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
